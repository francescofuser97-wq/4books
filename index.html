<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Manager in 15</title>
  <meta name="description" content="Riassunti audio di 15 minuti dei migliori libri di crescita personale per diventare manager.">
  <meta name="theme-color" content="#0e0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manager in 15">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>

    <div id="mini-player" class="mini-player" hidden>
      <button class="mini-open" data-action="open-player" aria-label="Apri il player">
        <span class="mini-cover" aria-hidden="true"></span>
        <span class="mini-text">
          <span class="mini-title"></span>
          <span class="mini-sub"></span>
        </span>
      </button>
      <button class="mini-toggle icon-btn" data-action="toggle" aria-label="Riproduci o metti in pausa"></button>
      <span class="mini-progress"><span></span></span>
    </div>

    <nav class="tabbar" aria-label="Navigazione principale">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Scopri</span></a>
      <a href="#/percorsi" data-tab="paths"><svg viewBox="0 0 24 24"><path d="M5 4h2v16H5zm6 0h2v16h-2zm6 0h2v16h-2z" opacity=".35"/><circle cx="6" cy="7" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="18" cy="17" r="2.5"/></svg><span>Percorsi</span></a>
      <a href="#/libreria" data-tab="library"><svg viewBox="0 0 24 24"><path d="M4 3h4v18H4zm6 0h4v18h-4zm5.5 1.2 3.9-1 4.4 17.3-3.9 1z"/></svg><span>Libreria</span></a>
    </nav>
  </div>

  <section id="player" class="player" hidden aria-label="Player">
    <div class="player-inner">
      <header class="player-head">
        <button class="icon-btn" data-action="close-player" aria-label="Chiudi player"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="player-label">In ascolto</span>
        <button class="icon-btn" data-action="open-text" aria-label="Leggi il testo"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10M4 20h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </header>
      <div class="player-cover"></div>
      <div class="player-meta">
        <h2 class="player-title"></h2>
        <p class="player-author"></p>
        <p class="player-chapter"></p>
      </div>
      <div class="seek">
        <input type="range" class="seek-bar" min="0" max="1000" value="0" step="1" aria-label="Posizione">
        <div class="seek-times"><span class="t-cur">0:00</span><span class="t-left">-0:00</span></div>
      </div>
      <div class="controls">
        <button class="icon-btn ctl-small" data-action="prev-chapter" aria-label="Capitolo precedente"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L18 5v14z"/></svg></button>
        <button class="icon-btn ctl-mid" data-action="rewind" aria-label="Indietro 15 secondi"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" text-anchor="middle" font-size="6.5" font-weight="700">15</text></svg></button>
        <button class="play-btn" data-action="toggle" aria-label="Riproduci"></button>
        <button class="icon-btn ctl-mid" data-action="fwd" aria-label="Avanti 30 secondi"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" text-anchor="middle" font-size="6.5" font-weight="700">30</text></svg></button>
        <button class="icon-btn ctl-small" data-action="next-chapter" aria-label="Capitolo successivo"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM14.5 12 6 19V5z"/></svg></button>
      </div>
      <div class="player-tools">
        <button class="pill" data-action="speed">1×</button>
        <button class="pill" data-action="sleep">Timer</button>
        <button class="pill" data-action="chapters">Capitoli</button>
        <button class="pill" data-action="download">Scarica</button>
      </div>
      <p class="engine-note" hidden></p>
    </div>
  </section>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
